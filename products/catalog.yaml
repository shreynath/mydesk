    version_file: products/draft/VERSION
    cmake_product: draft
    platforms: [macos-arm64, macos-x86_64, windows-x86_64, linux-x86_64]
    document_extension: .mydesk
    maturity: alpha
    notes: >
      Distinct commercial target from full AutoCAD. Currently shares the MyDeskDraft
      executable and Draft document model. LT-specific inventory and exclusions live in
      compatibility/target-manifests/draft-lt-autocad-lt-2025.json. Do not delete this
      row because Draft still lacks some full-AutoCAD features.
    comparison_targets:
      - { vendor: Autodesk, product: AutoCAD LT, versions: ["2025", "2026"] }
    docs: products/draft/docs
    issue_label: product:draft-lt


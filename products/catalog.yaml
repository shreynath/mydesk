# MyDesk product catalog — source of truth for standalone apps.
# Presence here is a TARGET inventory, not an implementation claim.
# maturity: catalog-stub | scaffolding | alpha | beta | production

schema_version: 1
updated: 2026-10-10

products:
  - id: draft
    name: MyDesk Draft
    binary: MyDeskDraft
    target_workflow: AutoCAD / AutoCAD LT class professional CAD
    entry_point: products/draft/app
    version_file: products/draft/VERSION
    cmake_product: draft
    platforms: [macos-arm64, macos-x86_64, windows-x86_64, linux-x86_64]
    document_extension: .mydesk
    maturity: alpha
    comparison_targets:
      - { vendor: Autodesk, product: AutoCAD, versions: ["2025", "2026"] }
      - { vendor: Autodesk, product: AutoCAD LT, versions: ["2025", "2026"] }
    docs: products/draft/docs
    packaging: products/draft/packaging
    issue_label: product:draft

  - id: draft-lt
    name: MyDesk Draft (AutoCAD LT track)
    binary: MyDeskDraft
    target_workflow: AutoCAD LT class 2D drafting (distinct commercial target)

shared_libraries:
  note: >
    Currently live under core/ (geometry, units, document, commands, exchange, modify).
    Incremental rename to libs/ is planned; do not break Draft builds for cosmetic moves.
  paths:
    - core/geometry
    - core/units
    - core/document
    - core/commands
    - core/exchange
    - core/modify
    - modules/draft  # Draft helpers; migrate into products/draft or libs as needed

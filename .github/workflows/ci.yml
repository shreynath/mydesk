name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  standalone-products:
    name: MyDesk ${{ matrix.product }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        product:
          - draft
          - draft-lt
          - mechanical
          - fusion
          - buildings
          - civil
          - infra
          - coordinate
          - animate
          - studio
          - surface
          - mill
          - simulation
          - vault
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packages=(cmake ninja-build)
          case "${{ matrix.product }}" in
            draft|draft-lt|mechanical|fusion|buildings|civil|infra|coordinate|animate|studio|surface|mill|simulation|vault)
              packages+=(qt6-base-dev libgl1-mesa-dev)
              ;;
          esac
          if [ "${{ matrix.product }}" = mechanical ] || [ "${{ matrix.product }}" = fusion ]; then
            packages+=(
              libocct-foundation-dev
              libocct-modeling-data-dev
              libocct-modeling-algorithms-dev
              libocct-data-exchange-dev
            )
          fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          packages=(cmake ninja)
          case "${{ matrix.product }}" in
            draft|draft-lt|mechanical|fusion|buildings|civil|infra|coordinate|animate|studio|surface|mill|simulation|vault)
              packages+=(qt@6)
              ;;
          esac
          if [ "${{ matrix.product }}" = mechanical ] || [ "${{ matrix.product }}" = fusion ]; then
            packages+=(opencascade)
          fi
          brew install "${packages[@]}"
          case "${{ matrix.product }}" in
            draft|draft-lt|mechanical|fusion|buildings|civil|infra|coordinate|animate|studio|surface|mill|simulation|vault)
              echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ninja cmake --yes --no-progress

      - name: Configure MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt (Windows desktop products)
        if: runner.os == 'Windows' && (matrix.product == 'draft' || matrix.product == 'draft-lt' || matrix.product == 'mechanical' || matrix.product == 'fusion' || matrix.product == 'buildings' || matrix.product == 'civil' || matrix.product == 'infra' || matrix.product == 'coordinate' || matrix.product == 'animate' || matrix.product == 'studio' || matrix.product == 'surface' || matrix.product == 'mill' || matrix.product == 'simulation' || matrix.product == 'vault')
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install aqtinstall
          aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -O "$HOME/Qt"
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/6.7.2/msvc2019_64" >> "$GITHUB_ENV"

      - name: Install Open CASCADE (Windows Mechanical/Fusion)
        if: runner.os == 'Windows' && (matrix.product == 'mechanical' || matrix.product == 'fusion')
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencascade:x64-windows
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -replace '\\', '/'
          "CMAKE_TOOLCHAIN_FILE=$toolchain" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure standalone product
        shell: bash
        run: |
          set -euo pipefail
          extra_args=()
          if [ -n "${CMAKE_PREFIX_PATH:-}" ]; then
            extra_args+=("-DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH")
          fi
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            extra_args+=("-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE")
          fi
          cmake -S . -B "build/ci-${{ matrix.product }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMYDESK_PRODUCT="${{ matrix.product }}" \
            -DMYDESK_BUILD_DESKTOP=ON \
            -DMYDESK_BUILD_TESTS=ON \
            "${extra_args[@]}"

      - name: Build standalone product
        shell: bash
        run: cmake --build "build/ci-${{ matrix.product }}" --parallel 2

      - name: Test standalone product
        shell: bash
        run: ctest --test-dir "build/ci-${{ matrix.product }}" --output-on-failure

      - name: Package standalone product
        shell: bash
        run: |
          set -euo pipefail
          generator=TGZ
          if [ "$RUNNER_OS" = Windows ]; then
            generator=ZIP
          fi
          mkdir -p "build/ci-${{ matrix.product }}/packages"
          cpack \
            --config "build/ci-${{ matrix.product }}/CPackConfig.cmake" \
            -G "$generator" \
            -B "build/ci-${{ matrix.product }}/packages"

      - name: Upload standalone development package
        uses: actions/upload-artifact@v4
        with:
          name: mydesk-${{ matrix.product }}-${{ runner.os }}-development-package
          path: |
            build/ci-${{ matrix.product }}/packages/*.tar.gz
            build/ci-${{ matrix.product }}/packages/*.zip
            build/ci-${{ matrix.product }}/packages/*.sha256
          if-no-files-found: error

      - name: Desktop GUI binary smoke (macOS/Linux)
        if: runner.os != 'Windows' && (matrix.product == 'draft' || matrix.product == 'draft-lt' || matrix.product == 'mechanical' || matrix.product == 'fusion' || matrix.product == 'buildings' || matrix.product == 'civil' || matrix.product == 'infra' || matrix.product == 'coordinate' || matrix.product == 'animate' || matrix.product == 'studio' || matrix.product == 'surface' || matrix.product == 'mill' || matrix.product == 'simulation' || matrix.product == 'vault')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.product }}" in
            draft) binary=MyDeskDraft ;;
            draft-lt) binary=MyDeskDraftLT ;;
            mechanical) binary=MyDeskMechanical ;;
            fusion) binary=MyDeskFusion ;;
            buildings) binary=MyDeskBuildings ;;
            civil) binary=MyDeskCivil ;;
            infra) binary=MyDeskInfra ;;
            coordinate) binary=MyDeskCoordinate ;;
            animate) binary=MyDeskAnimate ;;
            studio) binary=MyDeskStudio ;;
            surface) binary=MyDeskSurface ;;
            mill) binary=MyDeskMill ;;
            simulation) binary=MyDeskSimulation ;;
            vault) binary=MyDeskVault ;;
          esac
          root="build/ci-${{ matrix.product }}"
          BIN=""
          if [ -x "$root/products/${{ matrix.product }}/app/$binary.app/Contents/MacOS/$binary" ]; then
            BIN="$root/products/${{ matrix.product }}/app/$binary.app/Contents/MacOS/$binary"
          elif [ -x "$root/products/${{ matrix.product }}/app/$binary" ]; then
            BIN="$root/products/${{ matrix.product }}/app/$binary"
          else
            echo "$binary binary not found" >&2
            find "$root" -name "$binary*" -type f 2>/dev/null || true
            exit 1
          fi
          test -x "$BIN"
          echo "Smoke OK: $BIN"

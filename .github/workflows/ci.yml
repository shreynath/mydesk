name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  product-linux:
    name: MyDesk ${{ matrix.product }} (Linux)
    strategy:
      fail-fast: false
      matrix:
        product:
          - draft
          - draft-lt
          - mechanical
          - fusion
          - buildings
          - civil
          - infra
          - coordinate
          - animate
          - studio
          - surface
          - mill
          - simulation
          - vault
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build and product dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            qt6-base-dev \
            libgl1-mesa-dev \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev

      - name: Configure standalone product
        run: |
          cmake -S . -B "build/ci-${{ matrix.product }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMYDESK_PRODUCT="${{ matrix.product }}" \
            -DMYDESK_BUILD_DESKTOP=ON \
            -DMYDESK_BUILD_TESTS=ON

      - name: Build standalone product
        run: cmake --build "build/ci-${{ matrix.product }}" --parallel 2

      - name: Test standalone product
        run: ctest --test-dir "build/ci-${{ matrix.product }}" --output-on-failure

  draft-build-test:
    name: MyDesk Draft (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-linux
          - os: macos-latest
            preset: ci-macos
          - os: windows-latest
            preset: ci-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake qt6-base-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja cmake --yes
          pip install aqtinstall
          aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -O "$HOME/Qt"
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/6.7.2/msvc2019_64" >> "$GITHUB_ENV"

      - name: Configure Draft desktop
        shell: bash
        run: |
          cmake --preset "${{ matrix.preset }}" -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}" -DMYDESK_PRODUCT=draft -DMYDESK_BUILD_DESKTOP=ON

      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Test
        shell: bash
        run: ctest --test-dir build/ci --output-on-failure

      - name: Draft GUI smoke (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          if [ -x build/ci/products/draft/app/MyDeskDraft.app/Contents/MacOS/MyDeskDraft ]; then
            BIN=build/ci/products/draft/app/MyDeskDraft.app/Contents/MacOS/MyDeskDraft
          elif [ -x build/ci/products/draft/app/MyDeskDraft ]; then
            BIN=build/ci/products/draft/app/MyDeskDraft
          else
            echo "MyDeskDraft binary not found" >&2
            find build/ci -name 'MyDeskDraft*' -type f 2>/dev/null || true
            exit 1
          fi
          # Headless-friendly: start and quit quickly (Qt may need offscreen).
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-offscreen}"
          "$BIN" --help >/dev/null 2>&1 || true
          # App may not implement --help; ensure binary is executable and linked.
          test -x "$BIN"
          echo "Smoke OK: $BIN"
